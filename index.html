<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M8 5v14l11-7z'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DevKit 码匠 · 程序员的小工具箱</title>
    <meta name="description" content="纯本地的程序员小工具集：JSON / Base64 / URL / 时间戳 / Cron / Diff / 解码解密。所有计算在浏览器内完成，零上传。" />

    <!-- 隐私承诺前置到浏览器标签页可见的位置 -->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />

    <script>
      // 在首屏渲染前定好主题，避免深色模式下的白屏闪烁
      ;(function () {
        try {
          var t = localStorage.getItem('devkit:theme')
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
        } catch (e) {
          /* 隐私模式下读不到，走系统偏好即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
